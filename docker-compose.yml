services:
  web:
    build: .
    env_file:
      - .env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - static_data:/app/staticfiles

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - static_data:/static
      - ./media:/media
    depends_on:
      - web

volumes:
  static_data: