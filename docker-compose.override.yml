services:
  web:
    volumes:
      - .:/app
      - /app/.venv
      - /app/node_modules
      - ./media:/app/media
      - static_data:/app/staticfiles
    command: python manage.py runserver 0.0.0.0:8000
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/star-burger.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static
      - ./media:/media
    depends_on:
      - web