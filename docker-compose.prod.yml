services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: star-burger-frontend
    profiles: ["build"]

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    restart: always
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: